name: Build and deploy

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 04:00 UTC (06:00/07:00 in Turku)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Extract, load and transform
        run: python -m pipeline.run
      - name: Build site
        run: python -m site_builder.build
      - name: Keep raw pages (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: raw-pages
          path: raw/
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
