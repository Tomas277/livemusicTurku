name: Build and deploy

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 04:00 UTC (06:00/07:00 in Turku)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accept:
        description: "Sources whose gig count may drop sharply this run, e.g. kuka,apollo"
        required: false
        default: ""

permissions:
  contents: write   # the history file is committed back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pipeline_failed: ${{ steps.pipeline.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Extract, load and transform
        id: pipeline
        # A push only tests and rebuilds the site from the committed history; scraping runs on the schedule
        # and on manual runs.
        if: github.event_name != 'push'
        # A broken scraper must not stop the site updating; the "alert" job fails the run afterwards.
        continue-on-error: true
        env:
          LIVEMUSIC_ACCEPT: ${{ inputs.accept }}
        run: python -m pipeline.run
      - name: Save event history
        if: github.event_name != 'push'
        # The history CSV is the project's database. Committing it keeps it between runs for free.
        # Pushes made with GITHUB_TOKEN do not start another workflow run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warehouse/events_history.csv
          if git diff --cached --quiet; then
            echo "History unchanged"
          else
            git commit -m "Update event history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        run: python -m site_builder.build
      - name: Keep raw pages (90 days)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: raw-pages
          path: raw/
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    # Runs after a successful deploy, but fails the workflow run if any source failed,
    # so GitHub sends the failure email.
    needs: [build, deploy]
    if: needs.build.outputs.pipeline_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::At least one venue source failed. The site was still deployed without it. See the 'Extract, load and transform' step in the build job."
          exit 1
